# Workflow Catalog
# Used by /help to determine where a user is and what comes next.
#
# Artifact checks:
#   glob: file glob pattern — complete when at least min_count files match
#   pattern: text pattern that must appear in the file (checked after glob)
#   min_count: minimum distinct matching files required (default: 1).
#              ENFORCED by tools/workflow_state_check.py: a ledger step claiming
#              status=done with fewer matches reports CONFLICT (exit 1), and
#              bootstrap mode will not infer "done" below the count.
#   note: human-readable fallback when completion can't be auto-detected
#
# required: true → blocks progression to next phase (shown as REQUIRED)
# required: false → optional enhancement (shown as OPTIONAL)
# repeatable: true → runs multiple times (one per system, story, etc.)
#
# Phase gates (/gate-check): verdicts are ADVISORY — they guide the decision
# but never hard-block advancement. The user always decides whether to proceed.

phases:

  concept:
    label: "Concept"
    description: "Develop your game idea into a documented concept"
    next_phase: systems-design
    steps:
      - id: brainstorm
        name: "Brainstorm"
        command: /brainstorming
        required: false
        description: "Explore the game concept using MDA, verb-first, and player psychology frameworks"

      - id: engine-setup
        name: "Engine Setup"
        command: /setup-engine
        required: true
        artifact:
          glob: ".claude/docs/technical-preferences.md"
          pattern: "Engine: [^[]"
        description: "Configure engine, pin version, set naming conventions and performance budgets"

      - id: game-concept
        name: "Game Concept Document"
        command: /brainstorming
        required: true
        artifact:
          glob: "docs/gdd/game-concept.md"
        description: "Formalize concept with pillars, MDA analysis, and scope tiers"

      - id: design-review-concept
        name: "Concept Review"
        command: /design-review
        required: false
        description: "Validate the game concept (recommended before proceeding)"

      - id: art-bible
        name: "Art Bible"
        command: /art-bible
        required: true
        artifact:
          glob: "docs/art-bible.md"
        description: "Author the visual identity specification (9 sections). Uses the Visual Identity Anchor produced by /brainstorming. Run after game concept is formed, before systems design."

      - id: map-systems
        name: "Systems Map"
        command: /map-systems
        required: true
        artifact:
          glob: "docs/gdd/systems-index.md"
        description: "Decompose concept into systems with dependency ordering and priority tiers"

  systems-design:
    label: "Systems Design"
    description: "Author a GDD for each system in the systems index"
    next_phase: technical-setup
    steps:
      - id: design-system
        name: "System GDDs"
        command: /design-system
        required: true
        repeatable: true
        artifact:
          note: "Check docs/gdd/systems-index.md — each MVP system needs Status: Approved"
        description: "Author per-system GDDs (guided, section-by-section). Run once per system."

      - id: design-review
        name: "Per-System Design Review"
        command: /design-review
        required: true
        repeatable: true
        description: "Validate each GDD (8 required sections, no MAJOR REVISION verdict). Run per system."

      - id: review-all-gdds
        name: "Cross-GDD Review"
        command: /review-all-gdds
        required: true
        artifact:
          glob: "docs/gdd/gdd-cross-review-*.md"
        description: "Holistic consistency check + design theory review across all GDDs simultaneously"

      - id: consistency-check
        name: "Consistency Check"
        command: /consistency-check
        required: false
        repeatable: true
        description: "Scan all GDDs for contradictions, undefined references, and mechanic conflicts. Run after /review-all-gdds, and again any time a GDD is added or revised mid-project."

  technical-setup:
    label: "Technical Setup"
    description: "Architecture decisions, visual identity specification, accessibility foundations, engine validation"
    next_phase: pre-production
    steps:
      - id: create-architecture
        name: "Architecture Document"
        command: /create-architecture
        required: true
        artifact:
          glob: "docs/architecture/architecture.md"
        description: "Author the master architecture document covering all systems"

      - id: architecture-decision
        name: "Architecture Decisions (ADRs)"
        command: /architecture-decision
        required: true
        repeatable: true
        artifact:
          # NNN-<slug>.md only — the leading digit excludes the scaffolded
          # docs/adr/TEMPLATE.md, which is a skeleton, not a decision.
          glob: "docs/adr/[0-9]*.md"
          min_count: 3
        description: "Document key technical decisions as ADRs. Minimum 3 Foundation-layer ADRs required."

      - id: architecture-review
        name: "Architecture Review"
        command: /architecture-review
        required: true
        artifact:
          glob: "docs/architecture/architecture-review-*.md"
        description: "Validate completeness, dependency ordering, engine compatibility"

      - id: control-manifest
        name: "Control Manifest"
        command: /create-control-manifest
        required: true
        artifact:
          glob: "docs/architecture/control-manifest.md"
        description: "Flat programmer rules sheet generated from all Accepted ADRs"

      - id: accessibility-doc
        name: "Accessibility Requirements"
        required: true
        artifact:
          glob: "docs/accessibility-requirements.md"
        description: "Commit accessibility tier (Basic/Standard/Comprehensive/Exemplary) and feature matrix. UX specs (Phase 4) reference this tier."

  pre-production:
    label: "Pre-Production"
    description: "UX specs, asset specs, prototype the core mechanic, define stories, validate fun"
    next_phase: production
    steps:
      - id: asset-spec
        name: "Asset Specs"
        command: /asset-spec
        required: false
        repeatable: true
        artifact:
          glob: "docs/assets/asset-manifest.md"
        description: "Generate per-asset visual specifications and AI generation prompts from approved GDDs and level docs. Run once per system/level/character."

      - id: ux-design
        name: "UX Specs (key screens)"
        command: /ux-design
        required: true
        repeatable: true
        artifact:
          glob: "docs/ux/*.md"
          min_count: 1
        description: "Author UX specs for main menu, core gameplay HUD, and interaction patterns. Reads input method and platform from technical-preferences.md."

      - id: ux-review
        name: "UX Review"
        command: /ux-review
        required: true
        description: "Validate all key screen UX specs for GDD alignment and accessibility tier compliance. Run before creating epics."

      - id: prototype
        name: "Prototype"
        command: prototyper agent dispatch
        required: true
        artifact:
          glob: "prototypes/*/README.md"
          min_count: 1
        description: "Build throwaway prototypes in isolated worktree to validate core mechanic"

      - id: create-epics
        name: "Create Epics"
        command: /create-epics
        required: true
        repeatable: true
        artifact:
          glob: "production/epics/*/EPIC.md"
          min_count: 1
        description: "Translate GDDs + ADRs into epics — one per architectural module. Run per layer: /create-epics layer: foundation, then /create-epics layer: core"

      - id: create-stories
        name: "Create Stories"
        command: /create-stories
        required: true
        repeatable: true
        artifact:
          glob: "production/epics/**/*.md"
          min_count: 2
        description: "Break each epic into implementable story files. Run per epic: /create-stories [epic-slug]"

      - id: test-setup
        name: "Test Framework Setup"
        command: /test-setup
        required: false
        artifact:
          note: "Check tests/ directory for engine-specific test framework scaffold"
        description: "Scaffold the test framework and CI pipeline once before the first sprint. Leads to /test-helpers for fixture generation, /qa-plan per epic, and /smoke-check per sprint."

      - id: sprint-plan
        name: "First Sprint Plan"
        command: /sprint-plan
        required: true
        artifact:
          glob: "production/sprints/sprint-*.md"
          min_count: 1
        description: "Plan the first sprint with prioritized stories from epics"

      - id: vertical-slice
        name: "Vertical Slice (playtested)"
        command: /qa-plan (playtest section)
        required: true
        artifact:
          glob: "production/playtests/*.md"
          min_count: 1
        description: "Document vertical slice playtest sessions using /qa-plan (playtest section). Run at least once here (≥1 session required before Production; ≥3 required before Polish). Each session should cover one complete run-through of the core loop."

  production:
    label: "Production"
    description: "Sprint-based feature development — pick, implement, close stories"
    next_phase: polish
    steps:
      - id: sprint-plan
        name: "Sprint Plan"
        command: /sprint-plan
        required: true
        repeatable: true
        artifact:
          glob: "production/sprints/sprint-*.md"
        description: "Plan the current sprint with prioritized, ready stories"

      - id: story-readiness
        name: "Story Readiness Check"
        command: /story-readiness
        required: false
        description: "Validate a story is implementation-ready before a developer picks it up"

      - id: implement
        name: "Implement Stories"
        command: /dev-story
        required: true
        repeatable: true
        artifact:
          note: "Check src/ for active code and production/epics/**/*.md for In Progress stories"
        description: "Pick the next ready story and implement it with /dev-story [story-path]. Routes to the correct programmer agent."

      - id: code-review
        name: "Code Review"
        command: /code-review
        required: false
        repeatable: true
        description: "Architectural code review after each story implementation. Run after /dev-story, before /story-done."

      - id: story-done
        name: "Story Done Review"
        command: /story-done
        required: true
        repeatable: true
        description: "Verify all acceptance criteria, check GDD/ADR deviations, close the story"

      - id: qa-plan
        name: "QA Plan"
        command: /qa-plan
        required: false
        repeatable: true
        description: "Generate a QA test plan per epic or sprint. Run /qa-plan [epic-slug]. Produces test cases for /smoke-check, /regression-suite, and /test-evidence-review."

      - id: bug-report
        name: "Bug Report / Triage"
        command: /bug-report
        required: false
        repeatable: true
        description: "Log and prioritize bugs found during implementation. /bug-report creates a structured report; /bug-triage prioritizes the open backlog."

      - id: retrospective
        name: "Sprint Retrospective"
        command: /retrospective
        required: false
        repeatable: true
        description: "Post-sprint review to capture what worked and what to change. Run at the end of each sprint, before planning the next."

      - id: team-feature
        name: "Team Orchestration (optional)"
        required: false
        repeatable: true
        description: "Coordinate multiple agents on a complex feature. Use: /team-combat, /team-narrative, /team-ui, /team-audio, /team-level, /team-live-ops, /team-qa. Run when a feature spans multiple agent domains."

      - id: scope-check
        name: "Scope Check"
        command: /scope-check
        required: false
        repeatable: true
        artifact:
          glob: "production/sprints/sprint-*.md"
          note: "Run when stories are added mid-sprint, or before sprint retrospectives"
        description: "Detect scope creep by comparing current sprint scope to original epic scope. Run (a) when stories are added mid-sprint, or (b) before sprint retrospectives."

      - id: sprint-status
        name: "Sprint Status"
        command: /sprint-status
        required: false
        description: "Quick 30-line snapshot of sprint progress without a full report"

  polish:
    label: "Polish"
    description: "Performance, balance, playtesting, bug fixing"
    next_phase: release
    steps:
      - id: perf-profile
        name: "Performance Profile"
        command: performance-analyst dispatch
        required: false
        description: "Profile and optimize CPU/GPU/memory bottlenecks"

      - id: balance-check
        name: "Balance Check"
        command: /content-audit + systems-designer dispatch
        required: false
        description: "Analyze game balance formulas and data for outliers and broken progressions"

      - id: asset-audit
        name: "Asset Audit"
        command: /content-audit
        required: false
        description: "Verify naming conventions, file format standards, and size budgets"

      - id: playtest-polish
        name: "Playtest Sessions (×3)"
        command: /qa-plan (playtest section)
        required: true
        artifact:
          glob: "production/playtests/*.md"
          min_count: 3
        description: "Cover: new player experience, mid-game systems, difficulty curve"

      - id: team-polish
        name: "Polish Team Pass"
        command: /team-polish
        required: true
        description: "Coordinated polish pass across performance, audio, visual, and UX"

  release:
    label: "Release"
    description: "Launch preparation, certification, and ship"
    next_phase: null
    steps:
      - id: gate-check
        name: "Release Gate Check"
        command: /gate-check
        required: true
        description: "Pre-release validation across all departments (code, content, store, legal) — final launch readiness, last gate before shipping to players"

      - id: day-one-patch
        name: "Day-One Patch"
        command: /day-one-patch
        required: false
        description: "Scope, implement, and QA-gate a focused day-one patch for issues found after gold master; covers player-facing notes from git history"

# === WORKSTREAMS =============================================================
# Workstreams sit ABOVE phases. Each can be in any phase independently.
# Team orchestrators (/team-*) own workstream state files at
# production/workstreams/<name>.md. The phases above define WHAT to do;
# workstreams define WHERE (which domain) to do it.
#
# See docs/agent-coordination-map.md § Session Protocol for the wrapping protocol.

workstreams:
  combat:
    code: CB
    orchestrator: /team-combat
    state_file: production/workstreams/combat.md
    agents: [game-designer, systems-designer, gameplay-programmer, godot-gdscript-specialist, qa-tester]
    primary_patterns: [new-feature, bug-fix, balance-adjustment]

  narrative:
    code: NR
    orchestrator: /team-narrative
    state_file: production/workstreams/narrative.md
    agents: [narrative-director, writer, world-builder, game-designer]
    primary_patterns: [new-feature, new-area-level]
    # Support skills: on-demand craft references for the narrative write→distill
    # loop (see state_file). NOT pipeline steps — they annotate passes:
    # narrative-designer → distill pass + /design-system GDD support; your
    # preferred prose-editing skill (optional) → designer-invoked prose pre-flight.
    support_skills: [narrative-designer]

  ui-ux:
    code: UX
    orchestrator: /team-ui
    state_file: production/workstreams/ui-ux.md
    agents: [ux-designer, ui-programmer, godot-gdscript-specialist]
    primary_patterns: [new-feature, bug-fix]

  art:
    code: AR
    orchestrator: /team-art
    state_file: production/workstreams/art.md
    agents: [art-director, technical-artist]
    primary_patterns: [new-feature, new-area-level]

  audio:
    code: AU
    orchestrator: /team-audio
    state_file: production/workstreams/audio.md
    agents: [audio-director, sound-designer]
    primary_patterns: [new-feature, new-area-level]

  economy:
    code: EC
    orchestrator: /team-economy
    state_file: production/workstreams/economy.md
    agents: [economy-designer, systems-designer, game-designer]
    primary_patterns: [balance-adjustment, new-feature]

  level-world:
    code: LW
    orchestrator: /team-level
    state_file: production/workstreams/level-world.md
    agents: [level-designer, world-builder, game-designer]
    primary_patterns: [new-area-level, new-feature]

  qa:
    code: QA
    orchestrator: null  # producer-led
    state_file: production/workstreams/qa.md
    agents: [qa-lead, qa-tester]
    primary_patterns: [sprint-cycle]

  release:
    code: RL
    orchestrator: /team-release
    state_file: production/workstreams/release.md
    agents: [release-manager, devops-engineer, qa-lead, community-manager]
    primary_patterns: [release-pipeline]

  polish:
    code: PL
    orchestrator: /team-polish
    state_file: production/workstreams/polish.md
    agents: [performance-analyst, technical-artist, qa-tester]
    primary_patterns: [balance-adjustment, bug-fix]

  security:
    code: SC
    orchestrator: /team-security
    state_file: production/workstreams/security.md
    agents: [security-engineer, lead-programmer]
    primary_patterns: [bug-fix, new-feature]

  infrastructure:
    code: IF
    orchestrator: /team-infra
    state_file: production/workstreams/infrastructure.md
    agents: [tools-programmer, devops-engineer, godot-gdscript-specialist]
    primary_patterns: [new-feature, bug-fix]

  game-design:
    code: GD
    orchestrator: null  # creative-director-led
    state_file: production/workstreams/game-design.md
    agents: [creative-director, game-designer, systems-designer]
    primary_patterns: [new-feature, milestone-checkpoint]

  dialogue:
    code: DI
    parent: narrative
    orchestrator: null  # sub-workstream of narrative
    agents: [writer, narrative-director]

  quests:
    code: QS
    parent: game-design
    orchestrator: null  # sub-workstream of game-design
    agents: [game-designer, level-designer, writer]

  lore:
    code: LO
    parent: narrative
    orchestrator: null  # sub-workstream of narrative
    agents: [world-builder, writer]

  entry-flow:
    code: EF
    parent: ui-ux
    orchestrator: null  # sub-workstream of ui-ux
    agents: [ux-designer, ui-programmer]

  marketing:
    code: MK
    orchestrator: /team-marketing
    state_file: production/workstreams/marketing.md
    agents: [community-manager, producer]
    primary_patterns: [release-pipeline, live-event]

  market-research:
    code: MR
    orchestrator: null  # producer-led
    agents: [analytics-engineer, producer]
    primary_patterns: [milestone-checkpoint]
